<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get in Touch – Neeraja Deshpande</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#cfe3e1;font-family:'Libre Baskerville',serif;color:#b0206a}
a{color:#b0206a;text-decoration:none}
a:hover{color:#d5352a;text-decoration:underline}
::selection{background:#d5352a;color:#fff}
</style>
</head>
<body>
<nav style="position:sticky;top:0;z-index:10;background:#cfe3e1;display:flex;justify-content:center;align-items:center;gap:32px;padding:26px 44px;border-bottom:1px solid rgba(176,32,106,.2);flex-wrap:wrap">
  <a href="index.html" style="color:rgba(176,32,106,.7);font:500 17px/1 'Libre Baskerville',serif">Home</a>
  <a href="about.html" style="color:rgba(176,32,106,.7);font:500 17px/1 'Libre Baskerville',serif">About Me</a>
  <a href="writing.html" style="color:rgba(176,32,106,.7);font:500 17px/1 'Libre Baskerville',serif">Selected Writing</a>
  <a href="policy.html" style="color:rgba(176,32,106,.7);font:500 17px/1 'Libre Baskerville',serif">Policy Work</a>
  <a href="substack.html" style="color:rgba(176,32,106,.7);font:500 17px/1 'Libre Baskerville',serif">Substack</a>
  <a href="contact.html" style="color:#d5352a;font:500 17px/1 'Libre Baskerville',serif">Get in Touch</a>
</nav>
<footer style="max-width:460px;margin:0 auto;text-align:center;padding:90px 28px 110px;min-height:calc(100vh - 90px)">
  <div style="font:600 24px/1 'Libre Baskerville',serif;letter-spacing:.03em;text-transform:uppercase;color:rgba(176,32,106,.85);margin-bottom:16px;text-align:center">Get in Touch</div>
  <p style="font:400 19px/1.6 'Libre Baskerville',serif;color:rgba(176,32,106,.65);margin:0 0 26px">If you want to contact me, please fill out this form and I will get back to you as soon as possible.</p>
  <form action="https://formspree.io/f/your-form-id" method="POST" style="display:flex;flex-direction:column;gap:18px;text-align:left">
    <input type="text" name="name" required placeholder="Name" style="border:none;border-bottom:1px solid rgba(176,32,106,.3);background:transparent;padding:6px 0;font:400 18px/1 'Libre Baskerville',serif;color:#b0206a;outline:none" />
    <input type="email" name="email" required placeholder="Email" style="border:none;border-bottom:1px solid rgba(176,32,106,.3);background:transparent;padding:6px 0;font:400 18px/1 'Libre Baskerville',serif;color:#b0206a;outline:none" />
    <textarea name="message" rows="3" required placeholder="Message" style="border:none;border-bottom:1px solid rgba(176,32,106,.3);background:transparent;padding:6px 0;font:400 18px/1.5 'Libre Baskerville',serif;color:#b0206a;outline:none;resize:vertical"></textarea>
    <button type="submit" style="align-self:flex-start;border:none;background:transparent;font:italic 600 16px/1 'Libre Baskerville',serif;letter-spacing:.02em;color:#d5352a;cursor:pointer;padding:6px 0">Send &rarr;</button>
  </form>
</footer>
</body>
</html>
